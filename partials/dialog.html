  <dialog id="command-palette" class="bg-surface border border-surface-container-highest rounded-xl p-0 w-full max-w-xl shadow-2xl backdrop:bg-black/60">
    <div class="p-md border-b border-surface-container-highest flex items-center justify-between bg-surface-container-low">
      <div class="flex items-center gap-sm flex-1">
        <span class="material-symbols-outlined text-primary">terminal</span>
        <input id="command-input" type="text" placeholder="Type a command or page path..." class="bg-transparent border-none outline-none font-code-sm text-sm text-on-surface w-full"/>
      </div>
      <button id="close-palette" class="text-on-surface-variant hover:text-primary">
        <span class="material-symbols-outlined text-xl">close</span>
      </button>
    </div>
    <div id="command-results" class="max-h-72 overflow-y-auto"></div>
    <div class="p-xs bg-surface-container text-right font-code-sm text-[10px] text-on-surface-variant pr-md">
      Press ESC to dismiss
    </div>
  </dialog>
