  <dialog id="command-palette" class="bg-surface border border-surface-container-highest rounded-2xl p-0 w-full max-w-xl shadow-2xl backdrop:bg-black/60 overflow-hidden" aria-label="Command palette">
    <div class="h-14 border-b border-surface-container-highest flex items-center px-md gap-sm bg-surface-container-low">
      <span class="material-symbols-outlined text-primary shrink-0">search</span>
      <input id="command-input" type="text" placeholder="Search pages, projects, commands…" aria-label="Search" class="bg-transparent border-none outline-none font-code-sm text-sm text-on-surface w-full"/>
      <span class="kbd hidden sm:inline-block shrink-0">esc</span>
      <button id="close-palette" class="text-on-surface-variant hover:text-primary cursor-pointer" aria-label="Close">
        <span class="material-symbols-outlined text-xl">close</span>
      </button>
    </div>
    <div id="command-results" class="max-h-80 overflow-y-auto py-1.5"></div>
    <div class="px-md py-2 bg-surface-container border-t border-surface-container-highest font-code-sm text-[10px] text-on-surface-variant flex items-center gap-3 flex-wrap">
      <span><span class="kbd">↑</span><span class="kbd">↓</span> navigate</span>
      <span><span class="kbd">↵</span> open</span>
      <span class="ml-auto hidden sm:inline">esc dismiss</span>
    </div>
  </dialog>
