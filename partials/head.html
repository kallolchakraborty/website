<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>{{title}}</title>
  <meta name="description" content="{{description}}"/>
  <meta name="author" content="Kallol Chakraborty"/>
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1"/>
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)"/>
  <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)"/>
  <meta property="og:type" content="website"/>
  <meta property="og:site_name" content="Kallol Chakraborty"/>
  <meta property="og:title" content="{{title}}"/>
  <meta property="og:description" content="{{description}}"/>
  <meta property="og:url" content="https://kallolchakraborty.github.io/website/{{og_url}}"/>
  <meta property="og:image" content="https://kallolchakraborty.github.io/website/assets/og-card.png"/>
  <meta property="og:image:width" content="1200"/>
  <meta property="og:image:height" content="630"/>
  <meta property="og:image:alt" content="Kallol Chakraborty — AI Enthusiast & SAP BTP Solutions Architect"/>
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:title" content="{{title}}"/>
  <meta name="twitter:description" content="{{description}}"/>
  <meta name="twitter:image" content="https://kallolchakraborty.github.io/website/assets/og-card.png"/>
  <meta name="twitter:image:alt" content="Kallol Chakraborty — AI Enthusiast & SAP BTP Solutions Architect"/>
  <link rel="canonical" href="https://kallolchakraborty.github.io/website/{{og_url}}"/>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg"/>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png"/>
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png"/>
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono:ital,wght@0,400;0,700&family=Ubuntu:ital,wght@0,400;0,500;0,600;0,700&display=swap" rel="stylesheet"/>
  <link href="static/site.css" rel="stylesheet"/>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Kallol Chakraborty",
    "url": "https://kallolchakraborty.github.io/website/",
    "description": "Portfolio of Kallol Chakraborty — Principal Consultant, AI Enthusiast & SAP BTP Solutions Architect and 7x SAP Certified.",
    "inLanguage": "en",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://kallolchakraborty.github.io/website/?s={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>
  <script>
    (function() {
      function applyToggle() {
        var toggle = document.getElementById('theme-toggle');
        if (!toggle) return;
        var dark = document.documentElement.classList.contains('dark');
        var use = toggle.querySelector('use');
        if (use) use.setAttribute('href', dark ? '#i-light_mode' : '#i-dark_mode');
        toggle.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
      }
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
      document.addEventListener('DOMContentLoaded', function() {
        var toggle = document.getElementById('theme-toggle');
        if (!toggle) return;
        toggle.addEventListener('click', function() {
          var dark = document.documentElement.classList.toggle('dark');
          try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
          applyToggle();
        });
        applyToggle();
      });
    })();
  </script>
  {{extra_head}}
</head>
