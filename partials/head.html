<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>{{title}}</title>
  <meta name="description" content="{{description}}"/>
  <meta property="og:type" content="website"/>
  <meta property="og:site_name" content="Kallol Chakraborty"/>
  <meta property="og:title" content="{{title}}"/>
  <meta property="og:description" content="{{description}}"/>
  <meta property="og:url" content="https://kallolchakraborty.github.io/kallol-website-github-pages/{{og_url}}"/>
  <meta name="twitter:card" content="summary"/>
  <meta name="twitter:title" content="{{title}}"/>
  <meta name="twitter:description" content="{{description}}"/>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <link href="static/site.css" rel="stylesheet"/>
  <link href="styles.css" rel="stylesheet"/>
  <script>
    (function() {
      function applyToggle() {
        var toggle = document.getElementById('theme-toggle');
        if (!toggle) return;
        var dark = document.documentElement.classList.contains('dark');
        var icon = toggle.querySelector('.material-symbols-outlined');
        if (icon) icon.textContent = dark ? 'light_mode' : 'dark_mode';
        toggle.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
      }
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
      document.addEventListener('DOMContentLoaded', function() {
        var toggle = document.getElementById('theme-toggle');
        if (!toggle) return;
        toggle.addEventListener('click', function() {
          var dark = document.documentElement.classList.toggle('dark');
          try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
          applyToggle();
        });
        applyToggle();
      });
    })();
  </script>
  {{extra_head}}
</head>
